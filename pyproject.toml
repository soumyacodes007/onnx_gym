[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openenv-onnx-env"
version = "0.1.0"
description = "ONNX Deployment Surgeon Gym for OpenEnv"
requires-python = ">=3.10"
dependencies = [
    "openenv-core[core]>=0.2.1",
    "openai>=1.40.0",
    "onnx>=1.17.0",
    "onnxruntime>=1.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
server = "onnx_env.server.app:main"

[tool.setuptools]
include-package-data = true
packages = ["onnx_env", "onnx_env.server"]
package-dir = { "onnx_env" = ".", "onnx_env.server" = "server" }
